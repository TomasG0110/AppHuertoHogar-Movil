spring.application.name=huertohogar-backend

# Configuración H2 (Base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect


# Habilitar la consola H2 para que puedas ver los datos en el navegador
spring.h2.console.enabled=true

# Puerto del servidor (8080 es el default, pero asegurémonos)
server.port=8080
